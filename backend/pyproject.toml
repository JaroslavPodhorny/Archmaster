[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "archmaster-api"
version = "0.1.0"
description = "API for the ArchMaster CERMAT preparation platform."
requires-python = ">=3.9"
dependencies = [
    "eval-type-backport>=0.2.0;python_version<'3.10'",
    "fastapi>=0.115,<1.0",
    "pydantic>=2.0,<3.0",
    "sympy>=1.12",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
    "ruff>=0.6,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
