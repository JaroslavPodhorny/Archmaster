<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strom učiva M9</title>
<style>

  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1b1b; --fg: #e6e6e6; --dim: #9a9a9a; --line: #3a3a3a; --hover: #262626; --sel: #1f3350; --accent: #7fb0f0; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: var(--bg); color: var(--fg);
         font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #bar { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; padding: 6px 10px; border-bottom: 1px solid var(--line); }
  #bar input[type=search] { width: 220px; font: inherit; padding: 3px 6px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
  #bar select, #bar button { font: inherit; padding: 2px 6px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
  #bar label { white-space: nowrap; }
  #count { color: var(--dim); margin-left: auto; }
  #panes { flex: 1; display: flex; min-height: 0; }
  #tree { flex: 0 0 36%; min-width: 300px; overflow: auto; border-right: 1px solid var(--line); padding: 4px 0; outline: none; }
  #detail { flex: 1; overflow: auto; padding: 12px 16px; }
  .row { display: flex; align-items: baseline; gap: 6px; padding: 1px 10px; cursor: default; white-space: nowrap; }
  .row:hover { background: var(--hover); }
  .row.sel { background: var(--sel); }
  .tw { width: 12px; flex: none; color: var(--dim); text-align: center; }
  .p { width: 12px; flex: none; color: var(--dim); text-align: center; font-variant-numeric: tabular-nums; }
  .d0 { font-weight: 600; margin-top: 6px; }
  .d1 { padding-left: 26px; font-weight: 600; }
  .d2 { padding-left: 46px; }
  .p1 .nm { font-weight: 600; } .pS .nm, .p3 .nm { color: var(--dim); }
  .n { color: var(--dim); font-weight: 400; }
  .nm { overflow: hidden; text-overflow: ellipsis; }
  h1 { font-size: 17px; margin: 0 0 2px; }
  .path, .id { color: var(--dim); }
  dl { display: grid; grid-template-columns: 110px 1fr; gap: 4px 12px; margin: 12px 0; }
  dt { color: var(--dim); } dd { margin: 0; }
  a.side { color: var(--dim); }
  a { color: var(--accent); text-decoration: none; cursor: pointer; } a:hover { text-decoration: underline; }
  ul { margin: 0; padding-left: 16px; }
  .rl { margin-left: auto; padding-left: 10px; color: var(--accent); font-weight: 400; }
  .gcap { color: var(--dim); margin-top: 14px; }
  .gwrap { overflow-x: auto; border: 1px solid var(--line); margin: 4px 0 12px; padding: 8px; }
  .g { position: relative; }
  .g svg { position: absolute; left: 0; top: 0; }
  .g path { fill: none; stroke: var(--dim); stroke-opacity: .45; }
  .g path.direct { stroke: var(--accent); stroke-opacity: 1; }
  .gn { position: absolute; width: 150px; height: 36px; padding: 2px 5px; border: 1px solid var(--line); background: var(--bg); color: var(--fg);
        font-size: 11.5px; line-height: 15px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .gn:hover { background: var(--hover); text-decoration: none; }
  .gn.gsel { border-color: var(--accent); background: var(--sel); font-weight: 600; }
  .gn.far { color: var(--dim); }
  table.top { border-collapse: collapse; } table.top td { padding: 1px 12px 1px 0; vertical-align: top; } table.top td.num { text-align: right; color: var(--dim); }
  #shot { max-width: 100%; border: 1px solid var(--line); margin-top: 8px; display: block; background: #fff; }
  #shot[hidden] { display: none; }
  @media (max-width: 640px) { #panes { flex-direction: column; } #tree { flex: 0 0 50%; border-right: 0; border-bottom: 1px solid var(--line); } }
</style>
</head>

<div id="bar">
  <input id="q" type="search" placeholder="Hledat">
  <span>Priorita
    <label><input type="checkbox" class="pf" value="1" checked> 1</label>
    <label><input type="checkbox" class="pf" value="2" checked> 2</label>
    <label><input type="checkbox" class="pf" value="3" checked> 3</label>
    <label><input type="checkbox" class="pf" value="S" checked> S</label>
  </span>
  <select id="kind"><option value="">Všechny druhy</option></select>
  <label title="Zobrazí jen vybranou dovednost, vše, co potřebuje, a vše, co na ni navazuje"><input type="checkbox" id="rel"> Jen související</label>
  <button id="open">Rozbalit vše</button>
  <button id="close">Sbalit vše</button>
  <span id="count"></span>
</div>
<div id="panes">
  <div id="tree" tabindex="0"></div>
  <div id="detail"></div>
</div>

26 A 16.3", "pct": 1, "png": "../backend/data/screenshots/M9-2026-A-16.png", "main": true}]}, {"id": "ZAK.USUDEK.vsechna", "parent": "ZAK.USUDEK", "name": "Systematické vypsání všech řešení", "kind": "rozbor", "requires": [], "spec": "4", "note": "", "priority": "3", "items": 3, "tests": 3, "recent": 2, "points": "0,4", "success": 2, "hardest": ["2023 B 16.3"], "older": [], "dependents": 0, "reach": [3, 2, "0,4"], "ex": [{"ref": "2023 B 16.3", "pct": 2, "png": "../backend/data/screenshots/M9-2023-B-16.png", "main": false}, {"ref": "2025 D 7.2", "pct": 11, "png": "../backend/data/screenshots/M9-2025-D-07.png", "main": false}, {"ref": "2026 D 16.3", "pct": 5, "png": "../backend/data/screenshots/M9-2026-D-16.png", "main": false}]}, {"id": "ZAK.USUDEK.strategie", "parent": "ZAK.USUDEK", "name": "Strategické a netradiční geometrické úlohy", "kind": "rozbor", "requires": [], "spec": "4", "note": "", "priority": "3", "items": 7, "tests": 2, "recent": 2, "points": "0,5", "success": null, "hardest": [], "older": [], "dependents": 0, "reach": [2, 2, "0,5"], "ex": [{"ref": "2025 D 16.1", "pct": 14, "png": "../backend/data/screenshots/M9-2025-D-16.png", "main": true}, {"ref": "2025 D 16.2", "pct": 5, "png": "../backend/data/screenshots/M9-2025-D-16.png", "main": true}, {"ref": "2025 D 16.3", "pct": 6, "png": "../backend/data/screenshots/M9-2025-D-16.png", "main": true}, {"ref": "2025 D 16.4", "pct": 3, "png": "../backend/data/screenshots/M9-2025-D-16.png", "main": true}, {"ref": "2026 D 16.1", "pct": 26, "png": "../backend/data/screenshots/M9-2026-D-16.png", "main": true}, {"ref": "2026 D 16.2", "pct": 6, "png": "../backend/data/screenshots/M9-2026-D-16.png", "main": true}, {"ref": "2026 D 16.3", "pct": 5, "png": "../backend/data/screenshots/M9-2026-D-16.png", "main": true}]}];
const PRIORITY = {1: 'needed, itself or through a skill that builds on it, in at least 10 of the 16 standard tests or 6 of the 8 tests of 2025–2026', 2: 'needed in at least 4 of 16, or 3 of the last 8', 3: 'rarer, or only in the 2024 tests', S: 'in the specification, needed by no item of the 20 tests'};
const KIND = {postup: 'a procedure to drill', 'překlad': 'turning the wording into mathematics', znalost: 'a fact known by heart', rozbor: 'finding the route through a multi-step task'};
const byId = {}, kids = {}, neededBy = {};
for (const n of DATA) { byId[n.id] = n; (kids[n.parent] ||= []).push(n); }
for (const n of DATA) for (const r of n.requires) (neededBy[r] ||= []).push(n.id);
const depth = n => n.id.split('.').length - 1;
const collapsed = new Set();
let selected = DATA[0].id, visible = [];
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
for (const k of Object.keys(KIND)) $('kind').add(new Option(k, k));

// transitive prerequisites / dependents of a skill, each with its longest distance from it
function reach(id, next) {
  const dist = new Map();
  const visit = (x, d) => { for (const y of next(x)) if ((dist.get(y) || 0) < d) { dist.set(y, d); visit(y, d + 1); } };
  visit(id, 1);
  return dist;
}
const before = id => reach(id, x => byId[x].requires);
const after = id => reach(id, x => neededBy[x] || []);
const unlocks = {};
for (const n of DATA) if (depth(n) === 2) unlocks[n.id] = after(n.id).size;
let pre = new Map(), post = new Map();

function matches(n) {
  if ($('rel').checked && depth(byId[selected]) === 2 && n.id !== selected && !pre.has(n.id) && !post.has(n.id)) return false;
  const q = $('q').value.trim().toLowerCase(), kind = $('kind').value;
  const ps = [...document.querySelectorAll('.pf:checked')].map(c => c.value);
  return ps.includes(n.priority) && (!kind || n.kind === kind) &&
    (!q || (n.name + ' ' + n.note + ' ' + n.id).toLowerCase().includes(q));
}
function leavesOf(n) { return depth(n) === 2 ? [n] : (kids[n.id] || []).flatMap(leavesOf); }

function renderTree() {
  const filtering = ($('rel').checked && depth(byId[selected]) === 2) || $('q').value.trim() || $('kind').value || document.querySelectorAll('.pf:not(:checked)').length;
  const html = []; visible = []; let shown = 0;
  const walk = n => {
    const d = depth(n), hits = leavesOf(n).filter(matches);
    if (!hits.length) return;
    visible.push(n.id);
    const open = d < 2 && (filtering || !collapsed.has(n.id));
    html.push(`<div class="row d${d} ${d === 2 ? 'p' + n.priority : ''} ${n.id === selected ? 'sel' : ''}" data-id="${n.id}">` +
      (d === 2 ? `<span class="p" title="${PRIORITY[n.priority]}">${n.priority}</span>` : `<span class="tw">${open ? '▾' : '▸'}</span>`) +
      `<span class="nm">${esc(n.name)}</span>${d < 2 ? `<span class="n">${hits.length}</span>` : ''}` +
      (pre.has(n.id) ? '<span class="rl">předpoklad</span>' : post.has(n.id) ? '<span class="rl">navazuje</span>' : '') + '</div>');
    if (d === 2) shown++;
    if (open) (kids[n.id] || []).forEach(walk);
  };
  kids[''].forEach(walk);
  $('tree').innerHTML = html.join('');
  $('count').textContent = `${DATA.filter(n => depth(n) === 2 && matches(n)).length} z ${DATA.filter(n => depth(n) === 2).length} dovedností`;
}

const order = id => DATA.indexOf(byId[id]);
function graph(n) {
  const W = 150, H = 36, GX = 34, GY = 8, far = Math.max(0, ...pre.values());
  const direct = neededBy[n.id] || [], cols = Array.from({length: far + 2}, () => []);
  for (const [id, d] of pre) cols[far - d].push(id);
  cols[far].push(n.id);
  cols[far + 1] = [...direct];
  if (!direct.length) cols.pop();
  const tall = Math.max(...cols.map(c => c.length)), pos = {};
  cols.forEach((c, x) => c.sort((a, b) => order(a) - order(b)).forEach((id, y) => {
    pos[id] = [x * (W + GX), (tall - c.length) * (H + GY) / 2 + y * (H + GY)];
  }));
  const lines = [], boxes = [];
  for (const id in pos) {
    for (const r of byId[id].requires) if (pos[r]) {
      const [x1, y1] = pos[r], [x2, y2] = pos[id], a = x1 + W, b = y1 + H / 2, c = y2 + H / 2, m = (a + x2) / 2;
      lines.push(`<path class="${id === n.id || r === n.id ? 'direct' : ''}" d="M${a} ${b} C${m} ${b} ${m} ${c} ${x2} ${c}"/>`);
    }
    const k = byId[id], cls = id === n.id ? 'gsel' : (pre.get(id) || 1) > 1 ? 'far' : '';
    boxes.push(`<a class="gn ${cls}" data-go="${id}" title="${esc(k.name)} – ${esc(byId[k.parent].name)}" style="left:${pos[id][0]}px;top:${pos[id][1]}px">${esc(k.name)}</a>`);
  }
  const w = cols.length * (W + GX) - GX, h = tall * (H + GY) - GY;
  return `<div class="gcap">Vlevo vše, co je potřeba umět dřív (${pre.size}); vpravo, co na dovednost přímo navazuje (${direct.length}` +
    `${post.size > direct.length ? `, celkem na ni staví ${post.size}` : ''}). Kliknutím přejdete na dovednost.</div>` +
    `<div class="gwrap"><div class="g" style="width:${w}px;height:${h}px" data-x="${pos[n.id][0]}"><svg width="${w}" height="${h}">${lines.join('')}</svg>${boxes.join('')}</div></div>`;
}
function renderDetail() {
  const n = byId[selected], d = depth(n), rows = [];
  const path = []; for (let p = byId[n.parent]; p; p = byId[p.parent]) path.unshift(esc(p.name));
  if (d === 2) {
    rows.push(['Priorita', `${n.priority} – ${PRIORITY[n.priority]}`], ['Druh', `${n.kind} – ${KIND[n.kind]}`]);
  } else {
    const ls = leavesOf(n), c = p => ls.filter(l => l.priority === p).length;
    rows.push(['Dovednosti', `${ls.length} (priorita 1: ${c('1')}, 2: ${c('2')}, 3: ${c('3')}, S: ${c('S')})`]);
    const top = ls.filter(l => unlocks[l.id]).sort((a, b) => unlocks[b.id] - unlocks[a.id]).slice(0, 10);
    if (top.length) rows.push(['Na čem se nejvíc staví', '<table class="top">' + top.map(l =>
      `<tr><td class="num">${unlocks[l.id]}</td><td><a data-go="${l.id}">${esc(l.name)}</a></td></tr>`).join('') +
      '</table><span class="id">počet dalších dovedností, které tuto potřebují (i nepřímo)</span>']);
  }
  if (n.items) {
    rows.push(['V testech', (d === 2 ? 'přímo ' : '') + `${n.tests} ze 16 standardních, ${n.recent} z 8 posledních (2025–2026)`],
              ['Body', `${n.points} na standardní test` + (d === 2 ? ' závisí na této dovednosti' : '')]);
    if (d === 2 && n.dependents) rows.push(['S navazujícími', `${n.reach[0]} ze 16, ${n.reach[1]} z 8 posledních, ${n.reach[2]} b. ` +
      `<span class="id">(staví na ní ${n.dependents} dovedností; z toho se bere priorita)</span>`]);
    if (n.success !== null) rows.push(['Úspěšnost', `${n.success} % (řádné termíny)`]);
  }
  if (d === 2 && n.ex.length) {
    const shot = e => `<a data-shot="${e.png}"${e.main ? '' : ' class="side"'}>${e.ref.slice(5)}</a>${e.pct === null ? '' : ' ' + e.pct + ' %'}`;
    const hard = n.hardest.map(r => n.ex.find(e => e.ref === r));
    if (hard.length) rows.push(['Nejtěžší', hard.map(e => `<a data-shot="${e.png}">${e.ref}</a> ${e.pct} %`).join(' · ') +
      '<br><span class="id">zvládnout tyto úlohy = dovednost je zvládnutá</span>']);
    const years = [...new Set(n.ex.map(e => e.ref.slice(0, 4)))];
    rows.push([`Úlohy (${n.ex.length})`, '<table class="top">' + years.map(y =>
      `<tr><td class="num">${y}</td><td>${n.ex.filter(e => e.ref.startsWith(y)).map(shot).join(' · ')}</td></tr>`).join('') +
      '</table><span class="id">šedě: dovednost je v úloze potřeba, ale není hlavní</span>']);
  }
  if (d === 2 && n.older.length) rows.push(['Před rokem 2022', esc(n.older.join(' · ')) +
    '<br><span class="id">ze tří starších testů (2019 A, 2021 A, 2021 B); do čísel výše se nepočítají</span>']);
  if (n.spec) rows.push(['Specifikace', 'oblast ' + esc(n.spec)]);
  if (n.note) rows.push(['Poznámka', esc(n.note)]);
  $('detail').innerHTML = `<div class="path">${path.join(' › ')}</div><h1>${esc(n.name)}</h1><div class="id">${n.id}</div>` +
    `<dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>` +
    (d === 2 && pre.size + post.size ? graph(n) : '') + '<img id="shot" hidden>';
  const g = document.querySelector('.g');
  if (g) g.parentNode.scrollLeft = +g.dataset.x - g.parentNode.clientWidth / 2 + 75;
}
function select(id, reveal) {
  selected = id;
  pre = depth(byId[id]) === 2 ? before(id) : new Map();
  post = depth(byId[id]) === 2 ? after(id) : new Map();
  if (reveal) for (let p = byId[id].parent; p; p = byId[p].parent) collapsed.delete(p);
  renderTree(); renderDetail();
  document.querySelector('.row.sel')?.scrollIntoView({block: 'nearest'});
}

$('tree').addEventListener('click', e => {
  const row = e.target.closest('.row'); if (!row) return;
  const id = row.dataset.id;
  if (depth(byId[id]) < 2)
    collapsed.has(id) ? collapsed.delete(id) : collapsed.add(id);
  select(id);
});
$('tree').addEventListener('keydown', e => {
  const i = visible.indexOf(selected), n = byId[selected];
  if (e.key === 'ArrowDown' && i < visible.length - 1) select(visible[i + 1]);
  else if (e.key === 'ArrowUp' && i > 0) select(visible[i - 1]);
  else if (e.key === 'ArrowLeft') { if (depth(n) < 2 && !collapsed.has(n.id)) { collapsed.add(n.id); select(n.id); } else if (n.parent) select(n.parent); }
  else if (e.key === 'ArrowRight' && depth(n) < 2) { collapsed.delete(n.id); select(n.id); }
  else return;
  e.preventDefault();
});
$('detail').addEventListener('click', e => {
  if (e.target.dataset.go) select(e.target.dataset.go, true);
  if (e.target.dataset.shot) { const img = $('shot'); img.src = e.target.dataset.shot; img.hidden = false; }
});
$('q').addEventListener('input', renderTree);
$('kind').addEventListener('change', renderTree);
$('rel').addEventListener('change', renderTree);
document.querySelectorAll('.pf').forEach(c => c.addEventListener('change', renderTree));
$('open').onclick = () => { collapsed.clear(); renderTree(); };
$('close').onclick = () => { DATA.forEach(n => depth(n) < 2 && collapsed.add(n.id)); renderTree(); };
DATA.forEach(n => depth(n) === 1 && collapsed.add(n.id));
select(selected);
</script>
